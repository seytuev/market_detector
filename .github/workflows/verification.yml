name: Stabilization verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      HTF_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --constraint requirements.lock '.[dev]'
      - run: python -m pytest tests/test_postgres.py -q
      - run: python -m pytest -p tools.pytest_postgres tests/test_ltf_notify.py tests/test_events_store_v2.py tests/test_journal.py tests/test_data_sync.py tests/test_runtime_startup.py -q
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --constraint requirements.lock '.[dev]'
      - run: python tools/build_static.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --constraint requirements.lock '.[dev]' build
      - run: python tools/build_static.py
      - run: python -m build
      - run: python tools/check_package.py
      - run: docker build -t levelframe:verification .
      - run: docker run --rm --entrypoint python levelframe:verification -c "from app.db import Database; d=Database(); print(d.conn.execute('PRAGMA integrity_check').fetchone()[0]); d.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --constraint requirements.lock '.[dev]'
      - run: python tools/build_static.py
      - run: npm ci --prefix tools
      - run: python tests/stabilization_browser_server.py > browser-server.log 2>&1 &
      - run: node tools/check_stabilization_ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            tmp/stabilization-ui/*
            browser-server.log
