[project]
name = "htf-zones"
version = "0.2.0"
description = "HTF Zones — личный сервис обнаружения ценовых зон (спека v0.1)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "psycopg[binary]>=3.3,<4",
    "psycopg_pool>=3.3,<4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8",
    "pillow>=10",
    "websockets>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
app = ["schema.sql", "schema_postgres.sql", "web/static/*", "web/static/**/*"]
